name: TCP Flow Control

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guest-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo test --locked -p microsandbox-agentd -p microsandbox-protocol
      - run: rustfmt --edition 2024 --check crates/agentd/lib/tcp.rs crates/agentd/lib/agent.rs crates/protocol/lib/tcp.rs crates/protocol/lib/message.rs
  transport-and-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev libelf-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-on-failure: true
          workspaces: |
            . -> target
            vendor/russh -> target
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: cargo test --locked -p microsandbox-agent-client --features uds --lib
      - run: cargo test --locked -p microsandbox-runtime --lib runner::relay::tests
      - run: cargo test --locked -p microsandbox-network --lib
      - run: cargo test --locked -p microsandbox --features ssh --lib sandbox::ssh
      - run: cargo test --locked -p microsandbox --features ssh --lib sandbox::tcp
      - name: Check host-alias launch, restore, cloud, and CLI configuration
        run: |
          cargo test --locked -p microsandbox --features ssh --lib host_alias_ipv4
          cargo test --locked -p microsandbox-cli --lib network_config_host_alias_ipv4_ports
      - name: Exercise stop ownership and process-exit barriers
        run: |
          cargo test --locked -p microsandbox --features ssh --lib -- \
            backend::local::sandbox::stop::tests \
            backend::local::sandbox::process_exit::tests \
            backend::local::sandbox::tests::test_reconcile \
            backend::local::sandbox::tests::authenticated_shutdown_stream_is_signal_safe_without_reopening
      - run: cargo test --locked -p microsandbox --test snapshot_artifact create_from_disk_snapshot
      - run: cargo test --locked -p microsandbox-go
      - run: cargo build --locked -p microsandbox-go --features tcp-test-fixture
      - name: Exercise Go TCP connections through the native relay
        run: |
          env MICROSANDBOX_FFI_PATH="$PWD/target/debug/libmicrosandbox_go_ffi.so" \
            go -C sdk/go test -race -tags "tcp_native microsandbox_ffi_path" \
            -run TestTCP -count=1 -timeout 1m . ./internal/ffi
      - run: cargo test --locked --manifest-path vendor/russh/Cargo.toml --lib queued_reservations_survive
      - run: cargo test --locked --manifest-path vendor/russh/Cargo.toml --lib channels::tests
      - run: cargo check --locked --manifest-path sdk/go/native/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Check Node host-alias builders against the checkout native binding
        working-directory: sdk/node-ts
        run: |
          npm ci
          npm run build:native:debug
          npm run build:ts
          npx vitest run tests/unit/builders.test.ts -t 'port-scoped host-alias'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15.0"
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - name: Check Python host-alias configuration against the checkout native binding
        working-directory: sdk/python
        run: |
          uv sync --group dev --no-install-project
          uv run --no-sync maturin develop
          uv run --no-sync pytest tests/test_host_alias_ipv4_ports.py
      - run: cargo clippy --keep-going --locked -p microsandbox-agent-client -p microsandbox-runtime -p microsandbox --features microsandbox/ssh,microsandbox-agent-client/uds --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2024 --config skip_children=true --check vendor/russh/src/server/mod.rs vendor/russh/src/server/session.rs vendor/russh/src/server/encrypted.rs vendor/russh/src/client/mod.rs vendor/russh/src/client/session.rs vendor/russh/src/client/encrypted.rs vendor/russh/src/channels/mod.rs vendor/russh/src/channels/io/tx.rs vendor/russh/src/lib_inner.rs
  host-alias-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      LIBKRUNFW_VERSION: "5.6.1"
      LIBKRUNFW_ABI: "5"
      MSB_EMBED_ARTIFACTS_DIR: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require KVM on the Linux runner
        run: |
          if [ ! -c /dev/kvm ]; then
            echo '::error::The Linux host-alias live tests require /dev/kvm on this runner'
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: host-alias-live
          cache-bin: false
          cache-on-failure: true
      - name: Install runtime and kernel build dependencies
        run: scripts/ci/install-apt-packages.sh musl-tools libcap-ng-dev flex bison libelf-dev bc python3-pyelftools
      - name: Check out the candidate firmware source
        id: firmware
        run: |
          git submodule update --init --depth 1 vendor/libkrunfw
          echo "sha=$(git rev-parse HEAD:vendor/libkrunfw)" >> "$GITHUB_OUTPUT"
      - name: Cache the candidate firmware
        id: kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}
          key: host-alias-kernel-linux-x86_64-${{ steps.firmware.outputs.sha }}
      - name: Prepare verified kernel source
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-libkrunfw-kernel
      - name: Build candidate firmware
        if: steps.kernel.outputs.cache-hit != 'true'
        working-directory: vendor/libkrunfw
        run: make -j"$(nproc)"
      - name: Build and stage the candidate guest agent and firmware
        run: |
          cargo build --locked --profile ci -p microsandbox-agentd --target x86_64-unknown-linux-musl
          mkdir -p build
          cp target/x86_64-unknown-linux-musl/ci/agentd build/agentd
          touch build/agentd
          program_headers=$(readelf -lW build/agentd)
          if grep -q INTERP <<< "$program_headers"; then
            echo '::error::The candidate guest agent must not need a dynamic loader'
            exit 1
          fi
          cp vendor/libkrunfw/libkrunfw.so.$LIBKRUNFW_VERSION build/
          ln -sf libkrunfw.so.$LIBKRUNFW_VERSION build/libkrunfw.so.$LIBKRUNFW_ABI
          ln -sf libkrunfw.so.$LIBKRUNFW_ABI build/libkrunfw.so
      - name: Build the candidate runtime and Go FFI
        run: |
          cargo build --locked --profile ci --no-default-features --features net,ssh,embed-binaries -p microsandbox-cli
          cp target/ci/msb build/msb
          cargo build --locked --profile ci -p microsandbox-go
      - name: Select only candidate artifacts and an isolated test home
        run: |
          echo "MSB_PATH=$PWD/build/msb" >> "$GITHUB_ENV"
          echo "MSB_LIBKRUNFW_PATH=$PWD/build/libkrunfw.so" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/build" >> "$GITHUB_ENV"
          echo "MICROSANDBOX_FFI_PATH=$PWD/target/ci/libmicrosandbox_go_ffi.so" >> "$GITHUB_ENV"
          echo "MSB_HOME=$(mktemp -d /tmp/msb-host-alias-XXXXXX)" >> "$GITHUB_ENV"
      - name: Prove Rust SDK dual-family routing and original-destination policy
        shell: bash
        run: |
          cargo test --locked --profile ci -p microsandbox --features ssh --test host_access \
            registered_host_alias_ipv4_port_supports_both_guest_families_and_host_policy \
            -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/host-alias-rust.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/host-alias-rust.log"
      - name: Prove Go SDK dual-family routing and original-destination policy
        shell: bash
        run: |
          go -C sdk/go test -v -tags "integration microsandbox_ffi_path" \
            -run '^TestHostAliasIPv4PortsBothGuestFamilies$' -count=1 -timeout 10m \
            ./integration 2>&1 | tee "$RUNNER_TEMP/host-alias-go.log"
          grep -F -- '--- PASS: TestHostAliasIPv4PortsBothGuestFamilies (' "$RUNNER_TEMP/host-alias-go.log"
      - name: Upload focused guest-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-alias-live-logs
          path: |
            ${{ runner.temp }}/host-alias-*.log
            ${{ env.MSB_HOME }}/sandboxes/*/logs/runtime.log
          if-no-files-found: ignore
  go-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # sdk/go has no external dependencies; nothing to cache.
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go vet -tags "integration microsandbox_ffi_path" ./integration
      - run: go test ./...
  typescript-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - run: npm ci
      - run: npm run build -w @microsandbox/types && npm run build -w @microsandbox/protocol-client
      - run: npm run typecheck -w @microsandbox/agent-client
      - run: npm test -w @microsandbox/agent-client
